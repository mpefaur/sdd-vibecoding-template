# The one gate every agent passes through. The Claude Code hooks only run in
# Claude Code, and local commit hooks can be skipped; CI cannot.
#
#   secrets — Betterleaks over the full git history (AGENTS.md §6)
#   verify  — scripts/verify.sh --full: lint, tests, build (AGENTS.md §4)
#
# /kickoff adds the stack's toolchain setup to the `verify` job. Until then
# verify.sh has no commands and the job passes as a no-op.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: "1.9.0"
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks (checksum-pinned)
        run: |
          f="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$f"
          echo "${BETTERLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" betterleaks
      - name: Scan git history
        run: ./betterleaks git --redact --no-banner -v .

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /kickoff: add the toolchain for AGENTS.md §1 here (setup-node, setup-uv, …),
      # pinned by commit SHA like the checkout step above.
      - name: Verify
        run: ./scripts/verify.sh --full
      # hackathon-mode:begin — warn when a PR crosses path owners (scripts/hack.sh check
      # --changed). Never fails the build. Removed by graduate and by /kickoff.
      - name: Hackathon ownership warning
        if: github.event_name == 'pull_request' && hashFiles('.specify/mode.json') != ''
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/base"
          git diff --name-only origin/base HEAD | xargs scripts/hack.sh check --changed
      # hackathon-mode:end

  # template-only:begin — the template's own self-tests. /kickoff and `scripts/hack.sh on`
  # delete this block on adoption, so adopted projects never run it (research R13, R16).
  template-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the unadopted template
        id: template
        run: |
          if grep -q '^## 0. First run' AGENTS.md; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: steps.template.outputs.run == 'true'
      - name: Install pinned tools
        if: steps.template.outputs.run == 'true'
        run: |
          uv tool install "specify-cli==$(sed -n 's/^SPECKIT_VERSION="\(.*\)"/\1/p' scripts/setup.sh)"
          uv tool install pre-commit==4.6.2
      - name: Hackathon mode self-tests
        if: steps.template.outputs.run == 'true'
        run: tests/hack/run.sh
  # template-only:end
